#version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prom
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus/data'
    networks:
      - monitoring-network

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pgw
    ports:
      - "9091:9091"
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge
