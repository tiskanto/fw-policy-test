---
# #################################################
# fw-policy-test execution by using k8-cronjob task
# with Prometheus Push-Gateway enabled
# PROM_PGW_HOST = 192.168.0.223:9091
# #################################################

apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${PROJECT}-v1
  labels:
    app: ${PROJECT}-v1
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          hostNetwork: true
          containers:
          - name: ${PROJECT}-pgw
            image: ${DOCKER_IMAGE}
            imagePullPolicy: Never
            command: ["pytest"]
            args: ["-v" , "-s", "--tb=no"]

            securityContext:
              privileged: true
              runAsUser: 0
              capabilities:
                    add:
                      - NET_RAW
                      - NET_ADMIN

            terminationMessagePath: /var/log/fw-policy-test.log
            stdin: true
            tty: true
            env:
              - name: PROM_PGW_ENABLED
                value: "1"
              - name: PROM_PGW_HOST
                value: "192.168.0.223:9091"
          restartPolicy: Never

