---
############################################################
# This is a simple test case file for a fw-policy-test
# also the possible 'method' combination on a hostname
############################################################
- hostname: Linux System A
  ip_addr: 192.168.0.223
  test_set:
    - name: tcp_one
      desc: testing SSH port
      method: nmap
      proto: tcp
      port: 22
      expected: 1
    - name: udp_one
      desc: testing UDP port
      method: nmap
      proto: udp
      port: 137
      expected: 1
    - name: icmp one
      desc: testing icmp
      method: nmap
      proto: icmp
      port: 0
      expected: 1
- hostname: Linux System B
  ip_addr: 192.168.0.181
  test_set:
    - name: icmp one
      desc: testing icmp
      method: scapy
      proto: icmp
      port: 0
      expected: 1
    - name: tcp one
      desc: testing tcp
      method: scapy
      proto: tcp
      port: 22
      expected: 1
    - name: udp one
      desc: testing udp
      method: scapy
      proto: udp
      port: 137
      expected: 1
- hostname: Linux System C
  ip_addr: 192.168.7.181
  test_set:
    - name: ICMP one
      desc: testing ICMP
      method: scapy
      proto: icmp
      port: 0
      expected: 0
- hostname: Linux System D
  ip_addr: 192.168.17.221
  test_set:
    - name: icmp one
      desc: testing icmp
      method: nmap
      proto: icmp
      port: 0
      expected: 0
- hostname: Linux System E
  ip_addr: 192.168.0.198
  test_set:
    - name: udp one
      desc: testing udp
      method: nmap
      proto: udp
      port: 137
      expected: 1
    - name: tcp one
      desc: testing tcp
      method: scapy
      proto: tcp
      port: 22
      expected: 1
